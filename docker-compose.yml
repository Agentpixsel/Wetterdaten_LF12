services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wetterdaten
      POSTGRES_USER: wetter
      POSTGRES_PASSWORD: wetter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: wetterdaten
      DB_USER: wetter
      DB_PASSWORD: wetter

volumes:
  pgdata: